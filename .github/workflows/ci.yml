name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Python 3.14 was verified locally (throwaway venv): the full suite passes
        # (90 passed, 8 skipped) with the same fastapi/starlette/httpx stack as 3.11-3.13,
        # so it stays in the matrix and requires-python remains >=3.11 with no upper cap.
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/blastradius/node/package-lock.json
      - run: python -m pip install -e ".[dev,postgres,harness]"
      - run: blastradius setup
      - run: ruff check src tests scripts
      # Non-strict mypy (see [tool.mypy] in pyproject.toml); scoped overrides cover the
      # dynamically-typed modules, everything else is fully checked.
      - run: python -m mypy src
      - run: pytest -q
      # Coverage gate: measured 78% total line coverage; fail_under=75 leaves headroom.
      - run: python -m pytest -q --cov=blastradius --cov-report=term-missing
      - run: python scripts/accuracy.py
      - run: blastradius scan --format json --deterministic-id --fail-on low
      - run: python -m build
      - name: Verify wheel content and installation
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile, zipfile
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          names = zipfile.ZipFile(wheel).namelist()
          assert 'blastradius/node/worker.mjs' in names
          assert 'blastradius/node/package-lock.json' in names
          assert 'blastradius/migrations/001_initial.sql' in names
          assert 'blastradius/static/index.html' in names
          assert 'blastradius/static/app.js' in names
          assert 'blastradius/static/styles.css' in names
          assert not any('node_modules' in name for name in names)
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)
          with tempfile.TemporaryDirectory() as directory:
              subprocess.run([sys.executable, '-m', 'blastradius', 'setup'], cwd=directory, check=True)
              pathlib.Path(directory, 'main.ts').write_text('export const x = 1;', encoding='utf-8')
              subprocess.run([sys.executable, '-m', 'blastradius', 'scan', '--format', 'json'], cwd=directory, check=True)

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: blastradius
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: blastradius_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blastradius -d blastradius_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BLASTRADIUS_TEST_DATABASE_URL: postgresql://blastradius:test-only-password@localhost:5432/blastradius_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[dev,postgres,harness]"
      - run: blastradius setup
      - run: pytest -q tests/test_storage.py tests/test_comparison.py
