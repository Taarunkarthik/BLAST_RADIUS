name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/blastradius/node/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - run: blastradius setup
      - run: ruff check src tests scripts
      - run: pytest -q
      - run: blastradius scan --format json --deterministic-id --fail-on low
      - run: python -m build
      - name: Verify wheel content and installation
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile, zipfile
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          names = zipfile.ZipFile(wheel).namelist()
          assert 'blastradius/node/worker.mjs' in names
          assert 'blastradius/node/package-lock.json' in names
          assert not any('node_modules' in name for name in names)
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)
          with tempfile.TemporaryDirectory() as directory:
              subprocess.run([sys.executable, '-m', 'blastradius', 'setup'], cwd=directory, check=True)
              pathlib.Path(directory, 'main.ts').write_text('export const x = 1;', encoding='utf-8')
              subprocess.run([sys.executable, '-m', 'blastradius', 'scan', '--format', 'json'], cwd=directory, check=True)
